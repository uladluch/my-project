# Runs the Antigravity agent for this repository, so you can code from your
# phone without a computer. The Antigravity app starts it; compute comes from
# this repository's GitHub Actions minutes, the model from your Google account.
name: Antigravity Agent

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Pairing id created by the Antigravity app
        required: false
      token:
        description: One-time pairing token
        required: false
      expires:
        description: Invitation expiry (unix seconds)
        required: false

permissions:
  contents: write

concurrency:
  group: antigravity-agent
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install agent
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/agent" && cd "$RUNNER_TEMP/agent"
          curl -fsSL -o bridge.mjs https://antigravity.luch.dev/cloud/bridge-a6b1a625801f.mjs
          curl -fsSL -o start-cloud-bridge.mjs https://antigravity.luch.dev/cloud/start-cloud-bridge-37642eb5f9cd.mjs
          printf '%s  %s\n' a6b1a625801ff5390d2be7d3793bad16bc8a64a8ae644e60a3dc023c9a9c5204 bridge.mjs 37642eb5f9cd605b37f9de6c067eb735846e0591cf641e4e76150a9e367a0c54 start-cloud-bridge.mjs | sha256sum -c -
          npm install --no-audit --no-fund --silent node-pty@1.1.0

      - name: Configure git author
        run: |
          git config user.name "Antigravity Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run agent
        env:
          ANTIGRAVITY_PAIR_ID: ${{ inputs.pair }}
          ANTIGRAVITY_PAIR_TOKEN: ${{ inputs.token }}
          ANTIGRAVITY_PAIR_EXPIRES: ${{ inputs.expires }}
        run: node "$RUNNER_TEMP/agent/start-cloud-bridge.mjs"
