# Runs the Antigravity agent for this repository, so you can code from your
# phone without a computer. The Antigravity app starts it; compute comes from
# this repository's GitHub Actions minutes, the model from your Google account.
name: Antigravity Agent

on:
  workflow_dispatch:
    inputs:
      pair:
        description: Pairing id created by the Antigravity app
        required: false
      token:
        description: One-time pairing token
        required: false
      expires:
        description: Invitation expiry (unix seconds)
        required: false

permissions:
  contents: write

concurrency:
  group: antigravity-agent
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install agent
        run: |
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/agent" && cd "$RUNNER_TEMP/agent"
          curl -fsSL -o bridge.mjs https://antigravity.luch.dev/cloud/bridge-e02fb8d3a079.mjs
          curl -fsSL -o start-cloud-bridge.mjs https://antigravity.luch.dev/cloud/start-cloud-bridge-37642eb5f9cd.mjs
          printf '%s  %s\n' e02fb8d3a079fe30d6c198c2c07a8b7084c2a3d7f22bad6629a4f869ff50ad29 bridge.mjs 37642eb5f9cd605b37f9de6c067eb735846e0591cf641e4e76150a9e367a0c54 start-cloud-bridge.mjs | sha256sum -c -
          npm install --no-audit --no-fund --silent node-pty@1.1.0

      - name: Configure git author
        run: |
          git config user.name "Antigravity Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The app keeps your Google sign-in on your phone and hands it to this
      # repository as a secret, so the agent doesn't ask you to sign in again.
      - name: Restore Google sign-in
        env:
          GOOGLE_SIGN_IN: ${{ secrets.ANTIGRAVITY_GOOGLE_SIGN_IN }}
        run: |
          if [ -n "$GOOGLE_SIGN_IN" ]; then
            umask 077
            mkdir -p "$HOME/.gemini/antigravity-cli"
            printf '%s' "$GOOGLE_SIGN_IN" | base64 -d > "$HOME/.gemini/antigravity-cli/antigravity-oauth-token"
          fi

      - name: Run agent
        env:
          ANTIGRAVITY_PAIR_ID: ${{ inputs.pair }}
          ANTIGRAVITY_PAIR_TOKEN: ${{ inputs.token }}
          ANTIGRAVITY_PAIR_EXPIRES: ${{ inputs.expires }}
        run: node "$RUNNER_TEMP/agent/start-cloud-bridge.mjs"
